spring:
  application:
    name: backend
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/farm_direct}"
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      # Buộc PostgreSQL session dùng Asia/Ho_Chi_Minh thay vì alias Asia/Saigon
      # (Windows JVM map "SE Asia Standard Time" -> "Asia/Saigon", PostgreSQL không nhận).
      connection-init-sql: "SET TIME ZONE 'Asia/Ho_Chi_Minh'"
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    # Cho phép chạy V2 trên CSDL đã được tạo sẵn từ script SQL (chưa có flyway_schema_history).
    baseline-on-migrate: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 110MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}
  storage:
    evidence-dir: ${EVIDENCE_STORAGE_DIR:/var/lib/nsv/persistent-storage/evidences}
    max-image-bytes: 10485760   # 10 MB
    max-video-bytes: 104857600  # 100 MB
  security:
    require-https: false
    jwt:
      secret: ${JWT_SECRET:NongSanVietSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026}
      expiration-ms: 86400000 # 24 giờ
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:Quản trị viên}
