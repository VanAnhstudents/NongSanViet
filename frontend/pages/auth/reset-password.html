<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đặt lại mật khẩu — Nông Sản Việt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>

  <!-- Topbar -->
  <header class="auth-topbar">
    <a class="auth-topbar__logo" href="login.html">
      <img src="../../assets/images/logocnpm 1.png" alt="Logo Nông Sản Việt">
      <span>Nông Sản Việt</span>
    </a>
    <span class="auth-topbar__tagline">Từ nông trại đến bàn ăn</span>
  </header>

  <!-- Nội dung chính -->
  <main class="auth-wrap">

    <!-- Cột trái: slogan (desktop) -->
    <aside class="auth-visual">
      <div class="auth-visual__inner">
        <h2 class="auth-visual__heading">Đặt lại mật khẩu của bạn.</h2>
        <div class="auth-visual__img-wrap">
          <img
            src="../../assets/images/Ảnh nông sản.png"
            alt="Nông sản tươi ngon"
            class="auth-visual__img"
          >
        </div>
        <p class="auth-visual__caption">Nhập mã OTP và tạo mật khẩu mới.</p>
      </div>
    </aside>

    <!-- Cột phải: form -->
    <section class="auth-form-side">
      <div class="auth-card">

        <!-- Mobile logo -->
        <a class="auth-card__mobile-logo" href="login.html">
          <img src="../../assets/images/logocnpm 1.png" alt=""> Nông Sản Việt
        </a>

        <p class="auth-card__eyebrow">Khôi phục mật khẩu</p>
        <h1 class="auth-card__title">Đặt lại mật khẩu</h1>
        <p class="auth-card__subtitle">Bước 2/2 — Nhập mã xác thực và mật khẩu mới.</p>

        <!-- Stepper -->
        <div class="auth-steps" aria-hidden="true">
          <span class="auth-steps__num is-done">1</span>
          <span class="auth-steps__sep"></span>
          <span class="auth-steps__num is-active">2</span>
        </div>

        <p style="font-size:var(--fs-sm);color:var(--color-text-muted);margin-bottom:var(--space-4)">
          Mã OTP đã gửi đến số <strong id="phoneDisplay" class="mono">—</strong>
          &nbsp;<a href="forgot-password.html" style="font-weight:var(--fw-semibold);font-size:var(--fs-sm)">Đổi số</a>
        </p>

        <form id="resetForm" novalidate>

          <div class="form-field" id="fieldOtp">
            <label class="form-field__label" for="otp0">Mã xác thực (OTP)<span class="req">*</span></label>
            <div class="otp-inputs" id="otpInputs">
              <input class="form-field__input" type="text" id="otp0" inputmode="numeric" maxlength="1" aria-label="Ô OTP 1" autocomplete="one-time-code">
              <input class="form-field__input" type="text" id="otp1" inputmode="numeric" maxlength="1" aria-label="Ô OTP 2">
              <input class="form-field__input" type="text" id="otp2" inputmode="numeric" maxlength="1" aria-label="Ô OTP 3">
              <input class="form-field__input" type="text" id="otp3" inputmode="numeric" maxlength="1" aria-label="Ô OTP 4">
              <input class="form-field__input" type="text" id="otp4" inputmode="numeric" maxlength="1" aria-label="Ô OTP 5">
              <input class="form-field__input" type="text" id="otp5" inputmode="numeric" maxlength="1" aria-label="Ô OTP 6">
            </div>
            <p class="form-field__error" id="errOtp" hidden></p>
          </div>

          <div class="form-field" id="fieldPassword">
            <label class="form-field__label" for="password">Mật khẩu mới<span class="req">*</span></label>
            <div class="input-affix">
              <input class="form-field__input" type="password" id="password" name="password"
                     autocomplete="new-password" placeholder="Tối thiểu 8 ký tự, có chữ và số"
                     aria-describedby="helperPassword errPassword" required>
              <button class="input-affix__icon" type="button" id="togglePw" aria-label="Hiện mật khẩu" aria-pressed="false"></button>
            </div>
            <p class="form-field__helper" id="helperPassword">Từ 8 đến 72 ký tự, phải có cả chữ và số.</p>
            <p class="form-field__error" id="errPassword" hidden></p>
          </div>

          <div class="form-field" id="fieldConfirmPassword">
            <label class="form-field__label" for="confirmPassword">Nhập lại mật khẩu mới<span class="req">*</span></label>
            <div class="input-affix">
              <input class="form-field__input" type="password" id="confirmPassword" name="confirmPassword"
                     autocomplete="new-password" placeholder="Nhập lại mật khẩu mới"
                     aria-describedby="errConfirmPassword" required>
              <button class="input-affix__icon" type="button" id="togglePw2" aria-label="Hiện mật khẩu" aria-pressed="false"></button>
            </div>
            <p class="form-field__error" id="errConfirmPassword" hidden></p>
          </div>

          <button class="btn btn--primary btn--block btn--lg" type="submit" id="submitBtn">
            <span class="btn__label">Đặt lại mật khẩu</span>
          </button>

        </form>

        <p class="auth-card__footer-link">
          <a href="login.html">
            <span data-icon="arrow-left" data-size="16"></span> Quay lại đăng nhập
          </a>
        </p>

      </div>
    </section>

  </main>

  <script src="../../js/config.js"></script>
  <script src="../../js/icons.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/format.js"></script>
  <script src="../../js/core/form.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/pages/reset-password.js"></script>
</body>
</html>
