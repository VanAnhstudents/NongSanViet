<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng ký — Nông Sản Việt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>

  <!-- Nội dung chính -->
  <main class="auth-wrap">

    <!-- Cột trái: slogan (desktop) -->
    <aside class="auth-visual">
      <div class="auth-visual__inner">
        <h2 class="auth-visual__heading">Trở thành một phần của chuỗi nông sản sạch.</h2>
        <div class="auth-visual__img-wrap">
          <img
            src="../../assets/images/Ảnh nông sản.png"
            alt="Nông sản tươi ngon"
            class="auth-visual__img"
          >
        </div>
        <p class="auth-visual__caption">Mua tươi từ gốc hoặc đăng bán nông sản của bạn.</p>
      </div>
    </aside>

    <!-- Cột phải: form đăng ký -->
    <section class="auth-form-side">
      <div class="auth-card">

        <!-- Mobile logo -->
        <a class="auth-card__mobile-logo" href="login.html">
          <img src="../../assets/images/logocnpm 1.png" alt=""> Nông Sản Việt
        </a>

        <p class="auth-card__eyebrow">Tạo tài khoản mới</p>
        <h1 class="auth-card__title">Đăng ký</h1>
        <p class="auth-card__subtitle">Chọn vai trò và điền thông tin để bắt đầu.</p>

        <form id="registerForm" novalidate>

          <!-- Chọn vai trò -->
          <div class="role-chooser" id="roleChooser" role="radiogroup" aria-label="Vai trò đăng ký">
            <button type="button" class="role-chooser__option is-active" data-role="BUYER" role="radio" aria-checked="true">
              <span data-icon="shopping-bag" data-size="28"></span>
              <span class="role-chooser__name">Người mua</span>
              <span class="role-chooser__desc">Mua nông sản tươi</span>
            </button>
            <button type="button" class="role-chooser__option" data-role="FARMER" role="radio" aria-checked="false">
              <span data-icon="tractor" data-size="28"></span>
              <span class="role-chooser__name">Nông dân</span>
              <span class="role-chooser__desc">Bán nông sản</span>
            </button>
          </div>

          <div class="form-field" id="fieldFullName">
            <label class="form-field__label" for="fullName">Họ và tên<span class="req">*</span></label>
            <input class="form-field__input" type="text" id="fullName" name="fullName"
                   autocomplete="name" placeholder="vd: Nguyễn Mai Anh" maxlength="100"
                   aria-describedby="errFullName" required>
            <p class="form-field__error" id="errFullName" hidden></p>
          </div>

          <div class="form-field" id="fieldPhone">
            <label class="form-field__label" for="phone">Số điện thoại<span class="req">*</span></label>
            <input class="form-field__input" type="tel" id="phone" name="phone"
                   autocomplete="tel" inputmode="tel" placeholder="vd: 0912345678"
                   aria-describedby="errPhone helperPhone" required>
            <p class="form-field__helper" id="helperPhone">Dùng để đăng nhập và đặt lại mật khẩu qua OTP.</p>
            <p class="form-field__error" id="errPhone" hidden></p>
          </div>

          <div class="form-field" id="fieldEmail">
            <label class="form-field__label" for="email">Email</label>
            <input class="form-field__input" type="email" id="email" name="email"
                   autocomplete="email" inputmode="email" placeholder="vd: ban@email.com"
                   aria-describedby="errEmail">
            <p class="form-field__error" id="errEmail" hidden></p>
          </div>

          <div class="form-field" id="fieldPassword">
            <label class="form-field__label" for="password">Mật khẩu<span class="req">*</span></label>
            <div class="input-affix">
              <input class="form-field__input" type="password" id="password" name="password"
                     autocomplete="new-password" placeholder="Tối thiểu 8 ký tự, có chữ và số"
                     aria-describedby="helperPassword errPassword" required>
              <button class="input-affix__icon" type="button" id="togglePw" aria-label="Hiện mật khẩu" aria-pressed="false"></button>
            </div>
            <p class="form-field__helper" id="helperPassword">Từ 8 đến 72 ký tự, phải có cả chữ và số.</p>
            <p class="form-field__error" id="errPassword" hidden></p>
          </div>

          <div class="form-field" id="fieldConfirmPassword">
            <label class="form-field__label" for="confirmPassword">Nhập lại mật khẩu<span class="req">*</span></label>
            <div class="input-affix">
              <input class="form-field__input" type="password" id="confirmPassword" name="confirmPassword"
                     autocomplete="new-password" placeholder="Nhập lại mật khẩu"
                     aria-describedby="errConfirmPassword" required>
              <button class="input-affix__icon" type="button" id="togglePw2" aria-label="Hiện mật khẩu" aria-pressed="false"></button>
            </div>
            <p class="form-field__error" id="errConfirmPassword" hidden></p>
          </div>

          <label class="check-row" id="termsRow" for="agreeTerms">
            <input type="checkbox" id="agreeTerms" name="agreeTerms">
            <span>Tôi đồng ý với <a href="#" id="termsLink">Điều khoản sử dụng</a> và <a href="#" id="policyLink">Chính sách bảo vệ dữ liệu cá nhân</a>.</span>
          </label>
          <p class="form-field__error" id="errTerms" hidden style="margin-top:calc(var(--space-1)*-2);margin-bottom:var(--space-4)"></p>

          <button class="btn btn--primary btn--block btn--lg" type="submit" id="registerBtn">
            <span class="btn__label">Đăng ký</span>
          </button>

        </form>

        <p class="auth-card__footer-link">
          Đã có tài khoản? <a href="login.html">Đăng nhập</a>
        </p>

      </div>
    </section>

  </main>

  <script src="../../js/config.js"></script>
  <script src="../../js/icons.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/format.js"></script>
  <script src="../../js/core/form.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/pages/register.js"></script>
</body>
</html>
