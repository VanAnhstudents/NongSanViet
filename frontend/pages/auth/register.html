<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký tài khoản - Nông Sản Việt</title>
    <link rel="stylesheet" href="../../css/main.css" />
</head>
<body data-role="auth">
    <div class="app-shell">
        <div class="brand-header" id="app-brand-header"></div>
        <main class="content">
            <div class="eyebrow">BẮT ĐẦU CÙNG NÔNG NHÀ</div>
            <h1 class="page-title">Tạo tài khoản</h1>

            <div class="seg-tabs" style="margin-top:14px">
                <button type="button" class="seg-btn active">Mua nông sản</button>
                <button type="button" class="seg-btn">Bán nông sản</button>
            </div>

            <div class="form-group">
                <label class="form-label">Họ và tên</label>
                <input class="input" type="text" value="Nguyễn Mai Anh" />
            </div>

            <div class="form-group">
                <label class="form-label">Số điện thoại</label>
                <input class="input" type="tel" value="0912 345 678" />
            </div>

            <div class="form-group">
                <label class="form-label">Mật khẩu</label>
                <input class="input" type="password" placeholder="Tối thiểu 8 ký tự" />
            </div>

            <label class="check-row">
                <input type="checkbox" checked />
                <span>Tôi đồng ý với Điều khoản sử dụng và Chính sách bảo vệ dữ liệu cá nhân.</span>
            </label>

            <a href="verify-otp.html" class="btn btn-primary">Đăng ký tài khoản</a>

            <div style="text-align:center;margin-top:16px;font-size:13px">
                Đã có tài khoản? <a href="login.html" style="color:var(--primary);font-weight:700">Đăng nhập</a>
            </div>
        </main>
    </div>
    <script src="../assets/js/app.js"></script>
</body>
</html>
