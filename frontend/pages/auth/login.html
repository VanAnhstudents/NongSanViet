<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập — Nông Sản Việt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/auth.css">
</head>
<body class="auth-page">

  <!-- Header thanh trên cùng -->
  <header class="auth-topbar">
    <a class="auth-topbar__logo" href="login.html">
      <img src="../../assets/images/logocnpm 1.png" alt="Logo Nông Sản Việt">
      <span>Nông Sản Việt</span>
    </a>
    <span class="auth-topbar__tagline">Từ nông trại đến bàn ăn</span>
  </header>

  <!-- Nội dung chính -->
  <main class="auth-wrap">

    <!-- Cột trái: hình ảnh & slogan -->
    <aside class="auth-visual">
      <div class="auth-visual__inner">
        <h2 class="auth-visual__heading">Từ vườn xanh<br>đến bữa lành.</h2>
        <div class="auth-visual__img-wrap">
          <img
            src="../../assets/images/Ảnh nông sản.png"
            alt="Nông sản tươi ngon"
            class="auth-visual__img"
          >
        </div>
        <p class="auth-visual__caption">Mua tươi từ gốc. An tâm mỗi ngày.</p>
      </div>
    </aside>

    <!-- Cột phải: form đăng nhập -->
    <section class="auth-form-side">
      <div class="auth-card">
        <!-- Mobile logo -->
        <a class="auth-card__mobile-logo" href="login.html">
          <img src="../../assets/images/logocnpm 1.png" alt=""> Nông Sản Việt
        </a>

        <p class="auth-card__eyebrow">TỪ NÔNG TRẠI ĐẾN BÀN ĂN</p>
        <h1 class="auth-card__title">Chào bạn trở lại</h1>
        <p class="auth-card__subtitle">Mua tươi từ gốc. An tâm mỗi ngày.</p>

        <!-- Tab vai trò -->
        <div class="auth-role-tabs" role="tablist" aria-label="Chọn vai trò">
          <button
            class="auth-role-tabs__btn is-active"
            role="tab"
            aria-selected="true"
            data-role="buyer"
            type="button"
            id="tabBuyer"
            aria-controls="loginForm"
          >Người mua</button>
          <button
            class="auth-role-tabs__btn"
            role="tab"
            aria-selected="false"
            data-role="seller"
            type="button"
            id="tabSeller"
            aria-controls="loginForm"
          >Người bán</button>
        </div>

        <form id="loginForm" novalidate>
          <input type="hidden" id="roleInput" name="role" value="buyer">

          <div class="form-field" id="fieldIdentifier">
            <label class="form-field__label" for="identifier">Số điện thoại</label>
            <input
              class="form-field__input"
              type="text"
              id="identifier"
              name="identifier"
              autocomplete="username"
              placeholder="Nhập số điện thoại"
              required
            >
            <p class="form-field__error" id="errIdentifier" hidden></p>
          </div>

          <div class="form-field" id="fieldPassword">
            <label class="form-field__label" for="password">Mật khẩu</label>
            <div class="input-affix">
              <input
                class="form-field__input"
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="Nhập mật khẩu"
                required
              >
              <button class="input-affix__icon" type="button" id="togglePw" aria-label="Hiện/ẩn mật khẩu" aria-pressed="false"></button>
            </div>
            <p class="form-field__error" id="errPassword" hidden></p>
          </div>

          <div class="auth-card__forgot">
            <a href="forgot-password.html">Quên mật khẩu?</a>
          </div>

          <button class="btn btn--primary btn--block btn--lg" type="submit" id="loginBtn">
            <span class="btn__label">Đăng nhập</span>
          </button>

          <button class="btn btn--outline btn--block btn--lg auth-card__register-btn" type="button" onclick="location.href='register.html'">
            Tạo tài khoản mới
          </button>
        </form>
      </div>
    </section>

  </main>

  <script src="../../js/config.js"></script>
  <script src="../../js/icons.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/format.js"></script>
  <script src="../../js/core/form.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/pages/login.js"></script>
  <script>
    // Tab vai trò
    document.querySelectorAll('.auth-role-tabs__btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.auth-role-tabs__btn').forEach(b => {
          b.classList.remove('is-active');
          b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('is-active');
        btn.setAttribute('aria-selected', 'true');
        document.getElementById('roleInput').value = btn.dataset.role;
        // Cập nhật placeholder theo vai trò
        const inp = document.getElementById('identifier');
        if (btn.dataset.role === 'seller') {
          inp.placeholder = 'Nhập số điện thoại / email';
        } else {
          inp.placeholder = 'Nhập số điện thoại';
        }
      });
    });
  </script>
</body>
</html>
