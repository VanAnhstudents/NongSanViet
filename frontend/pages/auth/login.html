<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Nông Sản Việt</title>
    <link rel="stylesheet" href="../../css/main.css" />
</head>
<body data-role="auth">
    <div class="app-shell">
        <div class="brand-header" id="app-brand-header"></div>
        <main class="content">
            <div class="eyebrow">TỪ NÔNG TRẠI ĐẾN BÀN ĂN</div>
            <h1 class="page-title">Chào bạn trở lại</h1>
            <p class="subtitle">Mua tươi từ gốc. An tâm mỗi ngày</p>

            <div class="seg-tabs" id="roleTabs">
                <button type="button" class="seg-btn active" data-target="../buyer/home.html">Người mua</button>
                <button type="button" class="seg-btn" data-target="../farmer/dashboard.html">Người bán</button>
            </div>

            <div class="form-group">
                <label class="form-label">Số điện thoại</label>
                <input class="input" type="tel" placeholder="Nhập số điện thoại" value="0912 345 678" />
            </div>

            <div class="form-group">
                <label class="form-label">Mật khẩu</label>
                <input class="input" type="password" placeholder="Nhập mật khẩu" value="12345678" />
                <div style="text-align:right;margin-top:8px">
                    <a href="forgot-password.html" style="color:var(--primary);font-weight:600;font-size:13px">Quên mật khẩu?</a>
                </div>
            </div>

            <button type="button" class="btn btn-primary" onclick="handleLogin()">Đăng nhập</button>
            <a href="register.html" class="btn btn-soft">Tạo tài khoản mới</a>

            <div style="text-align:center;margin-top:18px">
                <a href="../admin/dashboard.html" class="meta-text" style="color:var(--primary);font-weight:600">
                    Đăng nhập cổng Quản trị viên →
                </a>
            </div>
        </main>
    </div>
    <script src=" ../../js/app.js"></script>
    <script>
            function handleLogin() {
              const activeTab = document.querySelector('#roleTabs .seg-btn.active');
                window.location.href = activeTab?.getAttribute('data-target') || '../../buyer/home.html';
            }
    </script>
</body>
</html>
