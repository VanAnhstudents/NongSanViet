<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quên mật khẩu — Nông Sản Việt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>

  <!-- Topbar -->
  <header class="auth-topbar">
    <a class="auth-topbar__logo" href="login.html">
      <img src="../../assets/images/logocnpm 1.png" alt="Logo Nông Sản Việt">
      <span>Nông Sản Việt</span>
    </a>
    <span class="auth-topbar__tagline">Từ nông trại đến bàn ăn</span>
  </header>

  <!-- Nội dung chính -->
  <main class="auth-wrap">

    <!-- Cột trái: slogan (desktop) -->
    <aside class="auth-visual">
      <div class="auth-visual__inner">
        <h2 class="auth-visual__heading">Lấy lại quyền truy cập tài khoản.</h2>
        <div class="auth-visual__img-wrap">
          <img
            src="../../assets/images/Ảnh nông sản.png"
            alt="Nông sản tươi ngon"
            class="auth-visual__img"
          >
        </div>
        <p class="auth-visual__caption">Nhập số điện thoại — chúng tôi gửi mã OTP ngay.</p>
      </div>
    </aside>

    <!-- Cột phải: form -->
    <section class="auth-form-side">
      <div class="auth-card">

        <!-- Mobile logo -->
        <a class="auth-card__mobile-logo" href="login.html">
          <img src="../../assets/images/logocnpm 1.png" alt=""> Nông Sản Việt
        </a>

        <p class="auth-card__eyebrow">Khôi phục mật khẩu</p>
        <h1 class="auth-card__title">Quên mật khẩu</h1>
        <p class="auth-card__subtitle">Bước 1/2 — Nhập số điện thoại để nhận mã xác thực.</p>

        <!-- Stepper -->
        <div class="auth-steps" aria-hidden="true">
          <span class="auth-steps__num is-active">1</span>
          <span class="auth-steps__sep"></span>
          <span class="auth-steps__num">2</span>
        </div>

        <form id="forgotForm" novalidate>
          <div class="form-field" id="fieldPhone">
            <label class="form-field__label" for="phone">Số điện thoại<span class="req">*</span></label>
            <input class="form-field__input" type="tel" id="phone" name="phone"
                   autocomplete="tel" inputmode="tel" placeholder="vd: 0912345678"
                   aria-describedby="errPhone" required>
            <p class="form-field__error" id="errPhone" hidden></p>
          </div>

          <button class="btn btn--primary btn--block btn--lg" type="submit" id="submitBtn">
            <span class="btn__label">Gửi mã xác thực</span>
          </button>
        </form>

        <p class="auth-card__footer-link">
          <a href="login.html">
            <span data-icon="arrow-left" data-size="16"></span> Quay lại đăng nhập
          </a>
        </p>

      </div>
    </section>

  </main>

  <script src="../../js/config.js"></script>
  <script src="../../js/icons.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/format.js"></script>
  <script src="../../js/core/form.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/pages/forgot-password.js"></script>
</body>
</html>
