<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản trị · Danh mục - Nông Sản Việt</title>
    <link rel="stylesheet" href="../../css/main.css" />
</head>
<body data-role="admin" data-active="categories">
    <div class="app-shell">
        <div class="brand-header" id="app-brand-header"></div>
        <nav class="admin-nav" id="app-admin-nav"></nav>
        <main class="content">
            <div class="eyebrow">QUẢN TRỊ / VẬN HÀNH</div>
            <h1 class="page-title">Quản lý danh mục</h1>

            <button type="button" class="btn btn-primary" style="margin:12px 0 14px" onclick="showToast('Mở biểu mẫu thêm danh mục mới')">+ Thêm danh mục</button>

            <div class="card row-between">
                <div>
                    <div class="card-title">Rau củ quả</div>
                    <div class="meta-text">24 sản phẩm · Đang hiển thị</div>
                </div>
                <button type="button" class="link-btn" onclick="showToast('Chỉnh sửa danh mục Rau củ quả')">Sửa</button>
            </div>

            <div class="card row-between">
                <div>
                    <div class="card-title">Trái cây</div>
                    <div class="meta-text">18 sản phẩm · Đang hiển thị</div>
                </div>
                <button type="button" class="link-btn" onclick="showToast('Chỉnh sửa danh mục Trái cây')">Sửa</button>
            </div>

            <div class="card row-between">
                <div>
                    <div class="card-title">Đặc sản vùng miền</div>
                    <div class="meta-text">08 sản phẩm · Đang hiển thị</div>
                </div>
                <button type="button" class="link-btn" onclick="showToast('Chỉnh sửa danh mục Đặc sản vùng miền')">Sửa</button>
            </div>

            <div class="card row-between">
                <div>
                    <div class="card-title">Combo nông sản</div>
                    <div class="meta-text">06 sản phẩm · Đang hiển thị</div>
                </div>
                <button type="button" class="link-btn" onclick="showToast('Chỉnh sửa danh mục Combo nông sản')">Sửa</button>
            </div>

            <p class="meta-text" style="margin-top:12px">Tên và thứ tự hiển thị được dùng chung trong bộ lọc tìm kiếm và form đăng bán.</p>
        </main>
    </div>
    <script src="../../js/app.js"></script>
</body>
</html>
