<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tin nhắn - Nông Sản Việt</title>
    <link rel="stylesheet" href="../../css/main.css" />
</head>
<body data-role="buyer">
    <div class="app-shell">
        <div class="brand-header" id="app-brand-header"></div>
        <main class="content" style="display:flex;flex-direction:column">
            <a href="home.html" class="eyebrow">‹ TIN NHẮN / TRAO ĐỔI TRỰC TIẾP</a>
            <h1 class="page-title">Vườn An</h1>

            <div class="card-green" style="margin-top:10px">
                <div class="card-title">Cà chua bi Đà Lạt</div>
                <div class="meta-text">40.000đ / kg · Thu hoạch ngày 18/11</div>
            </div>

            <div style="text-align:center" class="meta-text">Hôm nay · 10:20</div>

            <div class="chat-stream" id="chatStream">
                <div class="msg-out">Chào anh, cà chua thu hoạch ngày 18/11 đúng không ạ?</div>
                <div class="msg-in">Đúng rồi bạn nhé. Mình hái và đóng gói trong ngày, dự kiến bạn nhận hàng ngày 19/11.</div>
                <div class="msg-out">Cảm ơn anh, em đặt 5 kg!</div>
            </div>

            <form class="chat-bar" onsubmit="sendChat(event)">
                <input class="input" id="chatInput" type="text" placeholder="Nhập tin nhắn..." />
                <button type="submit" class="send-btn">↑</button>
            </form>
        </main>
    </div>
    <script src="../../js/app.js"></script>
    <script>
    function sendChat(e) {
      e.preventDefault();
      const inp = document.getElementById('chatInput');
      if (!inp.value.trim()) return;
      const bubble = document.createElement('div');
      bubble.className = 'msg-out';
      bubble.textContent = inp.value;
      document.getElementById('chatStream').appendChild(bubble);
      inp.value = '';
    }
    </script>
</body>
</html>
