<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khám phá nông sản - Nông Sản Việt</title>
  <link rel="stylesheet" href="../../css/main.css" />
</head>
<body data-role="buyer" data-active="home" data-bottom="true">
  <div class="app-shell">
    <div class="brand-header" id="app-brand-header"></div>

    <main class="content">
      <div class="eyebrow">GIAO ĐẾN · HÀ NỘI ▾</div>
      <h1 class="page-title">Tươi từ vườn nhà</h1>

      <a href="search.html" class="card" style="display:block;padding:12px 14px;color:var(--text-muted);margin:10px 0 14px">
        🔍 Tìm rau củ, trái cây, trang trại...
      </a>

      <div class="card-green row-between">
        <div>
          <div class="eyebrow" style="color:var(--primary)">MÙA NÀO, THỨC NẤY</div>
          <div style="font-size:17px;font-weight:700;margin:4px 0">Từ vườn xanh đến bữa lành.</div>
          <a href="preorder-deposit.html" style="font-size:12.5px;font-weight:600;color:var(--primary)">Đặt trước thu hoạch →</a>
        </div>
        <img src="https://images.unsplash.com/photo-1540420773420-3366772f4999?w=240&q=80" alt="Rau củ tươi"
             style="width:94px;height:82px;border-radius:12px;object-fit:cover" />
      </div>

      <div class="chip-row">
        <button type="button" class="chip active">Tất cả</button>
        <button type="button" class="chip">Rau củ</button>
        <button type="button" class="chip">Trái cây</button>
      </div>

      <div class="row-between" style="margin-bottom:10px">
        <strong>Đang vào mùa</strong>
        <a href="search.html" style="color:var(--primary);font-size:12.5px;font-weight:600">Xem tất cả</a>
      </div>

      <div class="grid-2">
        <a href="product-detail.html" class="product-card">
          <img src="https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=400&q=80" alt="Cà chua bi" />
          <strong>Cà chua bi</strong>
          <span class="meta-text">Vườn An · Lâm Đồng</span>
          <span class="price">40.000đ / kg</span>
        </a>
        <a href="cart.html" class="product-card">
          <img src="https://images.unsplash.com/photo-1576045057995-568f588f82fb?w=400&q=80" alt="Rau cải thìa" />
          <strong>Rau cải thìa</strong>
          <span class="meta-text">Vườn An · Lâm Đồng</span>
          <span class="price">25.000đ / kg</span>
        </a>
      </div>
    </main>
    <nav class="bottom-nav" id="app-bottom-nav"></nav>
  </div>
  <script src="../../js/app.js"></script>
</body>
</html>
