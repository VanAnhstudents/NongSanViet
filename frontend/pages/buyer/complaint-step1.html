<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gửi khiếu nại - Nông Sản Việt</title>
    <link rel="stylesheet" href="../../css/main.css" />
</head>
<body data-role="buyer">
    <div class="app-shell">
        <div class="brand-header" id="app-brand-header"></div>
        <main class="content">
            <a href="order-tracking.html" class="eyebrow">‹ ĐƠN HÀNG #NN1018 · BƯỚC 1 / 3</a>
            <h1 class="page-title">Gửi yêu cầu hỗ trợ</h1>

            <div class="card-amber" style="margin-top:12px">
                <div class="card-title">Còn 18 giờ để gửi khiếu nại</div>
                <div class="meta-text">Đã giao lúc 08:00, 11/11/2026.<br />Thời hạn gửi: 08:00, 12/11/2026.</div>
            </div>

            <div class="form-group">
                <label class="form-label">Vấn đề bạn gặp phải</label>
                <select class="select">
                    <option>Hỏng bên trong sản phẩm</option>
                    <option>Giao thiếu số lượng</option>
                    <option>Không đúng chủng loại cam kết</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Mô tả tình trạng</label>
                <textarea class="textarea">Cam bị hỏng bên trong sau khi bổ. Tôi muốn được hoàn tiền phần bị hỏng.</textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Minh chứng ảnh / video</label>
                <button type="button" class="btn btn-soft" onclick="showToast('Đã đính kèm 2 ảnh minh chứng')">+ Thêm ảnh hoặc video</button>
                <div class="meta-text" style="margin-top:6px">Ảnh ≤ 2 MB · Video ≤ 30 giây / 25 MB</div>
            </div>

            <a href="complaint-step2.html" class="btn btn-primary" style="margin-top:14px">Tiếp tục · Chọn phương án xử lý</a>
        </main>
    </div>
    <script src="../../js/app.js"></script>
</body>
</html>
