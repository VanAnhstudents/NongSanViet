<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phương án khiếu nại - Nông Sản Việt</title>
    <link rel="stylesheet" href="../../css/main.css" />
</head>
<body data-role="buyer">
    <div class="app-shell">
        <div class="brand-header" id="app-brand-header"></div>
        <main class="content">
            <a href="complaint-step1.html" class="eyebrow">‹ KHIẾU NẠI · BƯỚC 2 / 3</a>
            <h1 class="page-title">Phương án khiếu nại</h1>

            <div class="card-green" style="margin-top:12px">
                <div class="card-title">Đơn #NN1018 · Cam vàng</div>
                <div class="meta-text">1 kg bị hỏng bên trong<br />Đã thêm 2 ảnh minh chứng</div>
            </div>

            <div class="form-label" style="margin:14px 0 8px">Bạn muốn được hỗ trợ thế nào?</div>
            <label class="radio-row"><input type="radio" name="opt" checked /><span>Hoàn tiền phần hàng bị hỏng</span></label>
            <label class="radio-row"><input type="radio" name="opt" /><span>Đổi sản phẩm mới</span></label>

            <div class="form-group" style="margin-top:12px">
                <label class="form-label">Số tiền yêu cầu hoàn</label>
                <input class="input" type="text" value="45.000đ" />
            </div>

            <div class="card">
                <div class="card-title">Quyền lợi sau đồng kiểm</div>
                <div class="meta-text">Đồng kiểm đạt vẫn được khiếu nại lỗi ẩn trong 24 giờ từ lúc đơn đã giao.</div>
            </div>

            <a href="complaint-step3.html" class="btn btn-primary" style="margin-top:16px">Tiếp tục · Kiểm tra yêu cầu</a>
        </main>
    </div>
    <script src="../../js/app.js"></script>
</body>
</html>
